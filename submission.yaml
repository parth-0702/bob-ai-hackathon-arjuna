submission:
  title: "PortSentinel Nexus"

  problem_statement: >
    Combining L1 Container Congestion Predictor and Port Operations Optimiser
    with U1 Power Outage Prediction and Grid Equipment Failure Advisor,
    this project helps port operators understand how infrastructure degradation
    and weather reduce handling capacity and propagate vessel delays and
    congestion at Deendayal Kandla Port.

  solution_summary: >
    PortSentinel Nexus connects equipment inference, dependencies, deterministic
    queue simulation and scenario comparison with persisted human-reviewed plans.

  key_features:
    - "Interactive port view and backend-managed operational registers"
    - "Supplied model inference with explicit feature and provenance boundaries"
    - "Dependency-aware queue forecasts and ranked scenarios"
    - "Transactional human approvals, plans and audit history"
    - "Point-wise grounded explanations via selectable Groq, SambaNova or Bob adapters with deterministic fallback"

  tech_stack:
    languages: ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React", "Vite"]
    ibm_technologies: []
    databases: ["SQLite"]
    other: ["Three.js", "XGBoost", "scikit-learn", "Open-Meteo"]

  what_we_are_most_proud_of: >
    Infrastructure dependencies are connected to evaluated congestion responses
    while preserving human authority and exact analysis snapshots.

  known_limitations: >
    Port operations are simulated. Model preprocessing/class semantics and real
    Bob inference verification remain pending. No equipment commands are issued.

